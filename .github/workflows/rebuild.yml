# Rebuilds the site from the datastore on Hugging Face once a day, and commits the result
# when the records have changed. Works with GitHub Pages set to deploy from this branch.
# Start it by hand from the Actions tab to rebuild at once.
name: Rebuild from the datastore
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install huggingface_hub jsonschema
      - name: Copy the datastore
        run: python tools/fetch_datastore.py --to datastore_cache
      - name: Build
        id: build
        run: |
          before=$(sha1sum data/registry.js | cut -d' ' -f1)
          python source/build.py --datastore datastore_cache
          after=$(sha1sum data/registry.js | cut -d' ' -f1)
          if [ "$before" = "$after" ]; then echo "changed=no" >> "$GITHUB_OUTPUT"; else echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Commit the rebuilt site
        if: steps.build.outputs.changed == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild from the datastore"
          git push
